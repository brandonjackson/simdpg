# SimDPG — production-like local stack.
#
#   docker build -t simdpg:latest .   build the shared image ONCE
#   docker compose up                 start all systems + portal + delivery pool
#   docker compose down               stop (data volumes preserved)
#   docker compose down -v            stop and wipe all SQLite data
#
# Build the image first rather than `docker compose up --build`: without the
# Buildx/BuildKit plugin, Compose's legacy builder rebuilds this image once per
# service in parallel (7x npm ci -> OOM). See DEPLOY.md.
#
# Every service uses the same image (root Dockerfile); SERVICE_DIR/START_CMD
# select which workspace runs. Systems are independent — they don't call each
# other — so only the portal needs the cross-service *_URL vars. SEED_CMD seeds
# each system's database once, on a fresh volume.
#
# All services share one image name (simdpg:latest) so the heavy build runs
# ONCE and is reused by every service, instead of being rebuilt per service.

x-app: &app
  image: simdpg:latest
  build:
    context: .
    dockerfile: Dockerfile

services:
  # Work queue for simulation event delivery. In-memory only: the queue holds a
  # run's in-flight deliveries, which are worthless once the run is over, so
  # persistence would only cost fsyncs on the hot path.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The delivery pool. Stateless and interchangeable — no volume, no ports, no
  # per-run state (jobs carry their own simulationId), so scaling is just
  # `--scale sim-worker=N`. Workers never write SQLite; the scheduler flushes
  # their Redis counters, which is what keeps N processes off one writer.
  #
  # replicas: 8 comes from a measured ~1–2k deliveries/sec per Node process
  # against the 10k target. It is a starting guess, not a tuned value — see
  # DEPLOY.md for how to re-measure before changing it.
  sim-worker:
    <<: *app
    environment:
      SERVICE_DIR: simulation
      START_CMD: node dist/index.js worker
      REDIS_URL: redis://redis:6379
      SIM_WORKER_CONCURRENCY: 200
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 8

  # Benchmark target for `npm run sim:bench` (profile: bench, so a normal
  # `docker compose up` never starts it). It lives in compose rather than on the
  # host because the workers — in containers — have to be able to reach it.
  sim-mock-webhook:
    <<: *app
    profiles: ["bench"]
    environment:
      SERVICE_DIR: simulation
      START_CMD: node dist/mock-webhook.js
      PORT: 3010
      MOCK_LATENCY_MS: 0
    ports: ["3010:3010"]

  identity:
    <<: *app
    environment:
      SERVICE_DIR: systems/identity
      SEED_CMD: npm run db:seed -w @simdpg/identity
      PORT: 3001
    ports: ["3001:3001"]
    volumes: ["identity-data:/app/systems/identity/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  civil-registry:
    <<: *app
    environment:
      SERVICE_DIR: systems/civil-registry
      SEED_CMD: npm run db:seed -w @simdpg/civil-registry
      PORT: 3002
    ports: ["3002:3002"]
    volumes: ["civil-registry-data:/app/systems/civil-registry/data"]

  health:
    <<: *app
    environment:
      SERVICE_DIR: systems/health
      SEED_CMD: npm run db:seed -w @simdpg/health
      PORT: 3003
    ports: ["3003:3003"]
    volumes: ["health-data:/app/systems/health/data"]

  benefits:
    <<: *app
    environment:
      SERVICE_DIR: systems/benefits
      SEED_CMD: npm run db:seed -w @simdpg/benefits
      PORT: 3004
    ports: ["3004:3004"]
    volumes: ["benefits-data:/app/systems/benefits/data"]

  notifications:
    <<: *app
    environment:
      SERVICE_DIR: systems/notifications
      SEED_CMD: npm run db:seed -w @simdpg/notifications
      PORT: 3005
    ports: ["3005:3005"]
    volumes: ["notifications-data:/app/systems/notifications/data"]

  payments:
    <<: *app
    environment:
      SERVICE_DIR: systems/payments
      SEED_CMD: npm run db:seed -w @simdpg/payments
      PORT: 3006
    ports: ["3006:3006"]
    volumes: ["payments-data:/app/systems/payments/data"]

  social-registry:
    <<: *app
    environment:
      SERVICE_DIR: systems/social-registry
      SEED_CMD: npm run db:seed -w @simdpg/social-registry
      PORT: 3007
    ports: ["3007:3007"]
    volumes: ["social-registry-data:/app/systems/social-registry/data"]

  portal:
    <<: *app
    environment:
      SERVICE_DIR: portal
      START_CMD: npm run start
      PORT: 3000
      IDENTITY_URL: http://identity:3001
      CIVIL_REGISTRY_URL: http://civil-registry:3002
      HEALTH_URL: http://health:3003
      BENEFITS_URL: http://benefits:3004
      NOTIFICATIONS_URL: http://notifications:3005
      PAYMENTS_URL: http://payments:3006
      SOCIAL_REGISTRY_URL: http://social-registry:3007
      # Setting this is what switches a run's delivery from in-process POSTs to
      # the worker pool. The portal passes it through to the scheduler it spawns.
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    volumes: ["portal-data:/app/portal/data"]
    depends_on:
      redis:
        condition: service_healthy
      identity:
        condition: service_healthy
      civil-registry:
        condition: service_started
      health:
        condition: service_started
      benefits:
        condition: service_started
      notifications:
        condition: service_started
      payments:
        condition: service_started
      social-registry:
        condition: service_started

volumes:
  identity-data:
  civil-registry-data:
  health-data:
  benefits-data:
  notifications-data:
  payments-data:
  social-registry-data:
  portal-data:
