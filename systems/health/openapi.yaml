openapi: 3.0.3
info:
  title: SimDPG Health System
  version: 0.1.0
  license:
    name: MIT
  description: |
    Health and immunization registry for the SimDPG city-state — patient
    records, clinical encounters and vaccination history. Patients reference
    citizens by the UUID issued by the Identity system. Models the GovStack /
    DCI **Health / Immunization Registry** building block (think DHIS2).

    All responses use DCI API conventions: a standard error envelope, list
    pagination (`{ data, meta }`), `X-Request-ID` propagation, and ISO 8601
    timestamps.
servers:
  - url: http://localhost:3003
    description: Local development
tags:
  - name: Patients
    description: Register and look up patient records.
  - name: Encounters
    description: Record and query clinical encounters.
  - name: Vaccinations
    description: Record vaccinations and find overdue doses.
  - name: Admin
    description: Operational endpoints (stats, webhook log, reset).
  - name: System
    description: Health and documentation.
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  system: { type: string, example: health }
                  version: { type: string, example: 0.1.0 }
                  database:
                    type: string
                    enum: [ok, empty, error]
                    description: >
                      State of this system's database. `empty` means it is
                      usable but holds no data; `error` means it is broken. See
                      `/admin/db-health` for the detail.
  /patients:
    get:
      operationId: listPatients
      tags: [Patients]
      summary: List patients (or look up by citizen ID)
      description: >
        With no query parameters, returns a paginated list of patients.
        With `citizen_id`, returns the single matching patient.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: citizen_id
          in: query
          required: false
          schema: { type: string }
          description: Look up a single patient by their Identity citizen UUID.
      responses:
        "200":
          description: A page of patients, or a single patient when citizen_id is given.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PatientList"
                  - $ref: "#/components/schemas/Patient"
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createPatient
      tags: [Patients]
      summary: Register a patient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePatient" }
      responses:
        "201":
          description: Patient registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /patients/by-citizen/{citizen_id}:
    parameters:
      - name: citizen_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updatePatientStatus
      tags: [Patients]
      summary: Update a patient's status by their citizen ID
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePatient" }
      responses:
        "200":
          description: The updated patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /patients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getPatient
      tags: [Patients]
      summary: Get a patient by UUID
      responses:
        "200":
          description: The patient
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Patient" }
        "404": { $ref: "#/components/responses/NotFound" }
  /encounters:
    get:
      operationId: listEncounters
      tags: [Encounters]
      summary: Query encounters for a patient
      description: >
        Returns a paginated list of encounters for the given patient,
        optionally filtered by encounter type.
      parameters:
        - name: patient_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [checkup, emergency, vaccination, consultation]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of encounters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EncounterList" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createEncounter
      tags: [Encounters]
      summary: Record an encounter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEncounter" }
      responses:
        "201":
          description: Encounter recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encounter" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /encounters/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getEncounter
      tags: [Encounters]
      summary: Get an encounter by UUID
      responses:
        "200":
          description: The encounter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Encounter" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vaccinations:
    get:
      operationId: listVaccinations
      tags: [Vaccinations]
      summary: Vaccination history for a patient
      parameters:
        - name: patient_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of vaccinations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaccinationList" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      operationId: createVaccination
      tags: [Vaccinations]
      summary: Record a vaccination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVaccination" }
      responses:
        "201":
          description: Vaccination recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vaccination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /vaccinations/overdue:
    get:
      operationId: listOverdueVaccinations
      tags: [Vaccinations]
      summary: Patients with overdue vaccination doses
      description: >
        Returns a paginated list of vaccinations whose `next_dose_due` is
        before `as_of` and for which no subsequent dose of the same vaccine
        has been administered.
      parameters:
        - name: as_of
          in: query
          required: true
          schema: { type: string, format: date }
          description: ISO date (YYYY-MM-DD) to evaluate overdue status against.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of overdue vaccinations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/OverdueVaccination" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /admin/db-health:
    get:
      operationId: getDatabaseHealth
      tags: [Admin]
      summary: Database health — schema, writability, and row counts
      description: >
        Reports whether this system's database is actually usable: the tables
        and columns this build's queries need, whether the file can be written
        to, and row counts for the tables that should not be empty. Always
        answers 200, including when the database is broken — read `status`, not
        the HTTP status code. The portal polls this across every system and
        raises a banner when a report comes back unhealthy.
      responses:
        "200":
          description: Database health report
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: health }
                  status:
                    type: string
                    enum: [ok, empty, error]
                  file:
                    type: string
                    example: /app/systems/health/data/health.sqlite
                  writable: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  problems:
                    type: array
                    description: Human-readable problems, worst first.
                    items: { type: string }
                  missingTables:
                    type: array
                    items: { type: string }
                  missingColumns:
                    type: array
                    description: Missing columns as `table.column`.
                    items: { type: string }
                  counts:
                    type: object
                    description: Row counts for tables that should hold rows.
                    additionalProperties: { type: integer }
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [Admin]
      summary: Record counts for the health dashboard
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  system: { type: string }
                  patients: { type: integer }
                  encounters: { type: integer }
                  vaccinations: { type: integer }
  /admin/webhooks:
    get:
      operationId: listWebhookEvents
      tags: [Admin]
      summary: Paginated log of emitted webhook events
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: A page of webhook events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookEvent" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
  /admin/webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      tags: [Admin]
      summary: List per-event webhook subscriptions
      description: >
        Registrations for every event type. Pass `project_id` to list only the
        registrations belonging to one portal project.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: project_id
          in: query
          required: false
          description: Only return registrations belonging to this portal project.
          schema: { type: string }
      responses:
        "200":
          description: A page of webhook subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookSubscription" }
                  meta: { $ref: "#/components/schemas/ListMeta" }
    post:
      operationId: createWebhookSubscription
      tags: [Admin]
      summary: Register a webhook target for an event type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type, target_url]
              properties:
                event_type: { type: string }
                target_url: { type: string, format: uri }
                project_id:
                  type: string
                  description: >
                    Portal project (OpenFn project) this URL belongs to. Groups
                    the registration for management; delivery still fans out to
                    every registration matching the event type.
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookSubscription" }
  /admin/webhook-subscriptions/{id}:
    delete:
      operationId: deleteWebhookSubscription
      tags: [Admin]
      summary: Remove a webhook subscription
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Subscription deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  deleted: { type: boolean }
  /admin/reset:
    post:
      operationId: resetSystem
      tags: [Admin]
      summary: Wipe all patient, encounter and vaccination data
      responses:
        "200":
          description: Reset complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  system: { type: string }
                  reset: { type: boolean }
  /admin/behavior:
    get:
      operationId: getBehavior
      tags: [Admin]
      summary: Read this system's stochastic behaviour
      description: >
        The latency, injected-failure and rate-limit settings in force, plus
        counters for what has been injected so far. Off by default; a simulation
        applies a config for the length of its run and clears it afterwards.
      responses:
        "200":
          description: Current behaviour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorState" }
    put:
      operationId: setBehavior
      tags: [Admin]
      summary: Apply stochastic behaviour
      description: >
        Replace the behaviour config, using the same keys as openfn-mocker
        (latency, error_rate, error_status, rate_limit). Omitted keys fall back
        to off, or to the named preset when one is given. Behaviour applies to
        every route except /health, /docs and /admin, so the control plane keeps
        working however faulty the system is made.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BehaviorRequest" }
      responses:
        "200":
          description: Behaviour applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorState" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      operationId: resetBehavior
      tags: [Admin]
      summary: Clear stochastic behaviour
      description: >
        Return the system to its default behaviour — no added latency, no
        injected failures, no throttling.
      responses:
        "200":
          description: Behaviour cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BehaviorState" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page number.
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Items per page (max 100).
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    BehaviorConfig:
      type: object
      description: >
        Stochastic behaviour, using the same field names as openfn-mocker. Every
        field is optional; anything omitted keeps its default, which is off.
      properties:
        latency:
          type: object
          description: >
            Each request sleeps for a delay drawn from N(mean_ms, stddev_ms),
            clamped to [min_ms, max_ms], before the handler runs.
          properties:
            mean_ms: { type: integer, minimum: 0, default: 0 }
            stddev_ms:
              type: integer
              minimum: 0
              default: 0
              description: 0 makes every response take exactly mean_ms.
            min_ms: { type: integer, minimum: 0, default: 0 }
            max_ms:
              type: integer
              minimum: 0
              nullable: true
              default: null
              description: Upper clamp; null means no cap.
        error_rate:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Share of requests answered with a synthetic failure.
        error_status:
          type: integer
          minimum: 400
          maximum: 599
          default: 500
          description: Status used for injected failures.
        rate_limit:
          type: object
          description: >
            Fixed-window throttling: max requests per window_ms are served, and
            every request beyond that in the same window gets status.
          properties:
            max:
              type: integer
              minimum: 0
              default: 0
              description: 0 disables the limiter.
            window_ms: { type: integer, minimum: 1, default: 1000 }
            status: { type: integer, minimum: 400, maximum: 599, default: 429 }
    BehaviorRequest:
      allOf:
        - $ref: "#/components/schemas/BehaviorConfig"
        - type: object
          properties:
            preset:
              type: string
              enum: ["off", "realistic", "slow", "flaky", "rate-limited", "overloaded"]
              description: >
                Ready-made profile to start from. Any sibling field overrides the
                preset's value for that field.
            source:
              type: string
              description: Note about who applied this, e.g. "simulation 1a2b3c4d".
            expires_at:
              type: string
              format: date-time
              nullable: true
              description: >
                When the config clears itself. A simulation sets this just past
                the end of its run, so a worker that dies mid-run cannot leave
                the system permanently faulty.
    BehaviorState:
      type: object
      required: [system, enabled, config]
      properties:
        system: { type: string }
        enabled:
          type: boolean
          description: False when the current config changes nothing.
        config: { $ref: "#/components/schemas/BehaviorConfig" }
        preset:
          type: string
          nullable: true
          description: Matching preset id, or null when the config was hand-edited.
        source: { type: string, nullable: true }
        applied_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        counters:
          type: object
          description: Injection tallies since the config was applied.
          properties:
            requests: { type: integer }
            delayed: { type: integer }
            delay_ms_total: { type: integer }
            injected_errors: { type: integer }
            rate_limited: { type: integer }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: Optional machine-readable detail (e.g. field errors).
    ListMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
    Patient:
      type: object
      properties:
        id: { type: string, format: uuid }
        citizen_id: { type: string, format: uuid }
        blood_type:
          type: string
          nullable: true
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-", null]
        allergies: { type: string, nullable: true }
        registered_at: { type: string, format: date-time }
        status: { type: string, enum: [active, deceased, inactive] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PatientList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Patient" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    Encounter:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        type:
          type: string
          enum: [checkup, emergency, vaccination, consultation]
        date: { type: string, format: date }
        facility: { type: string }
        provider: { type: string }
        diagnosis: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [completed, scheduled, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EncounterList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Encounter" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    Vaccination:
      type: object
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid, nullable: true }
        vaccine_name: { type: string }
        dose_number: { type: integer, minimum: 1 }
        date_administered: { type: string, format: date }
        next_dose_due: { type: string, format: date, nullable: true }
        batch_number: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    VaccinationList:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Vaccination" }
        meta: { $ref: "#/components/schemas/ListMeta" }
    OverdueVaccination:
      type: object
      properties:
        patient_id: { type: string, format: uuid }
        citizen_id: { type: string, format: uuid }
        vaccine_name: { type: string }
        next_dose_due: { type: string, format: date }
    UpdatePatient:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, deceased, inactive] }
    CreatePatient:
      type: object
      required: [citizen_id]
      properties:
        citizen_id: { type: string }
        blood_type:
          type: string
          nullable: true
          enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-", null]
        allergies:
          type: string
          nullable: true
          description: >
            Allergies as a string, or an array of strings (which is stored as a
            JSON-encoded string).
    CreateEncounter:
      type: object
      required: [patient_id, type, date, facility, provider]
      properties:
        patient_id: { type: string, format: uuid }
        type:
          type: string
          enum: [checkup, emergency, vaccination, consultation]
        date: { type: string, format: date }
        facility: { type: string }
        provider: { type: string }
        diagnosis: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status:
          type: string
          enum: [completed, scheduled, cancelled]
          default: completed
    CreateVaccination:
      type: object
      required: [patient_id, vaccine_name, dose_number, date_administered, batch_number]
      properties:
        patient_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid, nullable: true }
        vaccine_name: { type: string }
        dose_number: { type: integer, minimum: 1 }
        date_administered: { type: string, format: date }
        next_dose_due: { type: string, format: date, nullable: true }
        batch_number: { type: string }
    WebhookEvent:
      type: object
      description: DCI / CloudEvents-style event envelope emitted to WEBHOOK_URL.
      properties:
        id: { type: string, format: uuid }
        type: { type: string, example: patient.registered }
        source: { type: string, example: health }
        time: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, delivered, failed, skipped] }
        error: { type: string, nullable: true }
    WebhookSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        target_url: { type: string, format: uri }
        project_id:
          type: string
          nullable: true
          description: >
            Portal project this registration belongs to; null for registrations
            made before projects existed.
        created_at: { type: string, format: date-time }
