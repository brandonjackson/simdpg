name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      # Issue-triggered runs work in the branch linked to the issue (created via
      # "Create a branch" on the issue page), falling back to the parent issue's
      # linked branch, then the default branch.
      - name: Resolve target branch
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request.url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # PR review events carry the head branch directly.
          if [ -n "$PR_BRANCH" ]; then
            echo "ref=$PR_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A comment on a PR arrives as issue_comment; use the PR head ref,
          # which resolves for fork PRs too.
          if [ -n "$IS_PR_COMMENT" ]; then
            echo "ref=refs/pull/$ISSUE_NUMBER/head" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ref=""
          if [ -n "$ISSUE_NUMBER" ]; then
            ref=$(gh api graphql -f query='
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  issue(number:$number) {
                    linkedBranches(first:1) { nodes { ref { name } } }
                    parent { linkedBranches(first:1) { nodes { ref { name } } } }
                  }
                }
              }' \
              -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$ISSUE_NUMBER" \
              --jq '.data.repository.issue
                    | (.linkedBranches.nodes[0].ref.name
                       // .parent.linkedBranches.nodes[0].ref.name
                       // "")' 2>/dev/null || true)
          fi

          echo "Resolved ref: ${ref:-${DEFAULT_BRANCH:-main}}"
          echo "ref=${ref:-${DEFAULT_BRANCH:-main}}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Prefix rules ("...:*") so real invocations match — e.g. "npm install redis",
          # "npx tsc -p simulation". Exact strings like "npm install" only match that
          # literal command. mcp_config is not a v1 input; the Playwright MCP server is
          # declared inline via --mcp-config instead.
          claude_args: |
            --allowedTools "Bash(npm ci:*),Bash(npm install:*),Bash(npm run build:*),Bash(npm run dev:*),Bash(npm run test:*),Bash(npm run lint:*),Bash(npx tsc:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),mcp__playwright__*"
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["-y","@playwright/mcp@latest"]}}}'
