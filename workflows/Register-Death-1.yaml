name: Register Death 1
jobs:
  Get-Citizen-Data:
    name: Get Citizen Data
    adaptor: "@openfn/language-http@7.3.2"
    body: |-
      // get citizen's data from citizen through id

      fn(state => {
            state.national_id = state.data.national_id;
            return state;
          });

      get(
        'https://simdpgidentity-production.up.railway.app/citizens', 
        state => ({
          query: { 
            national_id: state.national_id
          },
        }),
      );

      fn(state => {
            state.citizen_data = state.data;
            return state;
          });
  Present-Citizen-Data:
    name: Present Citizen Data
    adaptor: "@openfn/language-common@3.3.4"
    body: |-
      // Check out the Job Writing Guide for help getting started:
      // https://docs.openfn.org/documentation/jobs/job-writing-guide

      fn(state => {
        // for now just use the user id

        state.data = state.citizen_data;
        console.log('Citizen details', state.data);
        return state.data;
      });
triggers:
  webhook:
    type: webhook
    enabled: true
    webhook_reply: after_completion
edges:
  webhook->Get-Citizen-Data:
    condition_type: always
    enabled: true
    target_job: Get-Citizen-Data
    source_trigger: webhook
  Get-Citizen-Data->Present-Citizen-Data:
    condition_type: on_job_success
    enabled: true
    target_job: Present-Citizen-Data
    source_job: Get-Citizen-Data
